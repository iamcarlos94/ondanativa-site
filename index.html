  <body>
    <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

    <div class="site-shell">
      <header class="site-header" aria-label="Cabeçalho">
        <a class="brand" href="./" aria-label="Onda Nativa, página inicial">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M7 28.5c6.8 0 8.7-9 16.2-9 6 0 7.5 5.5 12.3 5.5 2.2 0 4-.9 5.5-2.4" />
              <path d="M7 35c6.8 0 8.7-9 16.2-9 6 0 7.5 5.5 12.3 5.5 2.2 0 4-.9 5.5-2.4" />
            </svg>
          </span>
          <span>Onda Nativa</span>
        </a>

        <span class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Em construção
        </span>
      </header>

      <main id="conteudo" class="hero">
        <section class="hero-copy" aria-labelledby="titulo-principal">
          <p class="eyebrow">Uma iniciativa Pulso Social</p>
          <h1 id="titulo-principal">Uma nova onda<br />está a formar-se.</h1>
          <p class="intro">
            Estamos a preparar este espaço. Em breve, a Onda Nativa terá aqui a sua casa digital.
          </p>

          <div class="coming-soon" aria-label="Informação de lançamento">
            <span class="coming-soon-label">A chegar</span>
            <span class="coming-soon-text">Novidades em breve</span>
          </div>
        </section>

        <div class="hero-art" aria-hidden="true">
          <div class="sun"></div>
          <div class="wave wave-back"></div>
          <div class="wave wave-middle"></div>
          <div class="wave wave-front"></div>
          <span class="orbit orbit-one"></span>
          <span class="orbit orbit-two"></span>
          <p class="art-note">comunidade em movimento</p>
        </div>
      </main>

      <footer class="site-footer">
        <p>Pulso Social <span aria-hidden="true">·</span> 2026</p>
        <p>ondanativa.com</p>
      </footer>
    </div>
